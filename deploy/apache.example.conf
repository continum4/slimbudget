# HTTPS virtual host with PHP-FPM. Adjust the paths, the socket and the certificate.
# Give the app its own PHP-FPM pool and user: other sites on the machine could read its files otherwise.
<VirtualHost *:80>
    ServerName budget.example
    Redirect permanent / https://budget.example/
</VirtualHost>

<VirtualHost *:443>
    ServerName budget.example
    DocumentRoot "/var/www/slimbudget/public"

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "/etc/ssl/budget.example.pem"
    SSLCertificateKeyFile "/etc/ssl/budget.example-key.pem"

    # The app sends its own security headers; these cover the static files
    Header always setifempty Strict-Transport-Security "max-age=31536000"
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always unset X-Powered-By
    Header unset X-Powered-By
    ServerSignature Off
    LimitRequestBody 1048576

    <Directory "/var/www/slimbudget/public">
        DirectoryIndex index.php
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/slimbudget.sock|fcgi://localhost/"
    </FilesMatch>
</VirtualHost>
